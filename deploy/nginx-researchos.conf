# /etc/nginx/sites-available/researchos  (included inside nginx's http{} block)
# certbot --nginx adds the HTTPS server block and the HTTP->HTTPS redirect.

limit_req_zone $binary_remote_addr zone=researchos_upload:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=researchos_api:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name researchos.duckdns.org;

    server_tokens off;
    access_log off;                      # privacy: no per-request logs (errors are still logged)
    client_max_body_size 30m;            # keep >= MAX_PDF_MB
    client_body_timeout 60s;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Uploads: a few per minute per client address.
    location = /api/jobs {
        limit_req zone=researchos_upload burst=3 nodelay;
        limit_req_status 429;
        include /etc/nginx/researchos_proxy.conf;
    }

    location /api/ {
        limit_req zone=researchos_api burst=60 nodelay;
        limit_req_status 429;
        include /etc/nginx/researchos_proxy.conf;
    }

    location / {
        include /etc/nginx/researchos_proxy.conf;
    }
}
